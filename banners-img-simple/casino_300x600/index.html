.m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;visibility:hidden}

background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%),var(--bigGrad);background-size:250% 100%,100% 100%;background-repeat:no-repeat;
-webkit-background-clip:text;background-clip:text;color:transparent;

.legal .onjn-logo,.legal .onjn-age{height:100%;max-height:10px}

@keyframes drift{to{transform:translateX(8%)}}

@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}

@keyframes beat{0%,20%,100%{scale:1}10%{scale:1.06}}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{to{transform:scale(1.15);opacity:.7}}
@keyframes bounce{0%,100%{transform:translateY(-7%)}50%{transform:translateY(5%)}}

58%{transform:translateY(-821px);filter:none}64%,100%{transform:translateY(-810px)}}

#ad{--bg:radial-gradient(80% 70% at 50% 22%,rgba(247,203,141,.22) 0%,transparent 70%),radial-gradient(120% 130% at 50% 15%,#1f2f60 0%,#101b3a 45%,#070c1a 100%);

.pre{color:#ff6a80}
.post{color:#fff;background:#EB2743;padding:.14em .55em .12em;border-radius:8px}

.coin{perspective:400px;animation:coinDrift 4.5s ease-in-out infinite alternate}.coin img{display:block;width:100%;height:100%;object-fit:contain;animation:coinTurn 4.6s ease-in-out infinite;animation-delay:inherit}

.photo-reel:nth-of-type(1) img{left:-63.333%}.photo-reel:nth-of-type(2) img{left:-177.917%}.photo-reel:nth-of-type(3) img{left:-294.167%}
.slot-photo::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,#fff7 48%,transparent 63%);transform:translateX(-130%);animation:metalGleam 4.8s ease-in-out infinite}
.sweep{opacity:.45}

@keyframes realBounce{0%,100%{transform:translateY(-5%)}50%{transform:translateY(3%)}}
@keyframes ballRoll{from{transform:rotate(-12deg)}to{transform:rotate(20deg)}}
@keyframes realShadow{0%,100%{transform:scaleX(.74);opacity:.35}50%{transform:scaleX(1);opacity:1}}
@keyframes coinDrift{from{transform:translateY(0) rotate(-9deg)}to{transform:translateY(-20%) rotate(9deg)}}

@keyframes slotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}

@media(prefers-reduced-motion:reduce){#ad *,#ad *::before,#ad *::after{animation:none!important}.ball img,.coin img{transform:none}.slot-photo::after{display:none}}

/* Casino symbols: independent depth, drift and tilt, clipped by the banner. */
.edge-coins{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;--px:0px;--py:0px}
.edge-coin{position:absolute;transform:translate3d(calc(var(--px)*var(--depth)),calc(var(--py)*var(--depth)),0);transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.edge-coin-float{display:block;width:100%;height:100%;animation:edgeCoinDrift var(--duration) var(--delay) ease-in-out infinite alternate;will-change:transform}
.edge-coin img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px #0006);animation:edgeCoinTilt 7s var(--delay) ease-in-out infinite alternate}
@keyframes edgeCoinDrift{from{transform:translate3d(calc(var(--dx)*-1),calc(var(--dy)*-1),0) rotate(-12deg)}to{transform:translate3d(var(--dx),var(--dy),0) rotate(17deg)}}
@keyframes edgeCoinTilt{from{transform:perspective(400px) rotateY(-32deg) rotateZ(-8deg)}to{transform:perspective(400px) rotateY(35deg) rotateZ(10deg)}}
@media(prefers-reduced-motion:reduce){.edge-coin{transform:none;transition:none}.edge-coin-float,.edge-coin img{animation:none!important}}

/* Each reel shows distinct symbols while spinning and settles sharply. */
.t-casino .hero{animation:slotEnter .45s .3s both}
@keyframes slotEnter{from{opacity:0}to{opacity:1}}
.slot-photo{animation:none;filter:none}

/* A single compositor transform gives each reel a continuous, sharp spin. */
.photo-track{animation:none!important;transform:translate3d(0,0,0);will-change:transform;backface-visibility:hidden}
.photo-reel{contain:paint}
</style></head>
