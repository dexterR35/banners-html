.legal .onjn-number{height:100%;max-height:10px;min-width:0;flex:0 1 auto}

.num{display:inline-block}
.ln-post{margin-top:.05em}
.post{font-weight:900!important;letter-spacing:.12em!important;padding:.16em .6em .14em!important}
.hwrap,.art{position:absolute;inset:0}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.slide.act{opacity:1}
.hasimg .art{display:none}

.ring.edge{border-width:2.5px;border-color:#fff;box-shadow:0 0 0 2px var(--acc),0 0 16px var(--glow),inset 0 0 16px var(--glow);z-index:16}

@keyframes drift{to{transform:translateX(8%)}}
@keyframes streak{0%{transform:translateX(0);opacity:0}12%{opacity:.85}100%{transform:translateX(560px);opacity:0}}
@keyframes float{to{transform:translate(12px,-14px) scale(1.2)}}

@keyframes fxin{from{transform:scale(1.18);opacity:0}}
@keyframes beat{0%,20%,100%{scale:1}10%{scale:1.06}}

@keyframes breathe{to{transform:scale(1.15);opacity:.7}}

@keyframes shadow{0%,100%{transform:scaleX(.7);opacity:.5}50%{transform:scaleX(1);opacity:1}}

58%{transform:translateY(0px);filter:none}64%,100%{transform:translateY(0px)}}
@keyframes win{0%,60%,100%{box-shadow:0 0 0 1px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.5),0 0 22px rgba(247,203,141,.35)}

.legal b{color:var(--gold)}

/* Edge coins: independent depth, drift and tilt, clipped by the banner. */
.edge-coins{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;--px:0px;--py:0px}
.edge-coin{position:absolute;transform:translate3d(calc(var(--px)*var(--depth)),calc(var(--py)*var(--depth)),0);transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.edge-coin-float{display:block;width:100%;height:100%;animation:edgeCoinDrift var(--duration) var(--delay) ease-in-out infinite alternate;will-change:transform}
.edge-coin img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px #0006);animation:edgeCoinTilt 7s var(--delay) ease-in-out infinite alternate}
@keyframes edgeCoinDrift{from{transform:translate3d(calc(var(--dx)*-1),calc(var(--dy)*-1),0) rotate(-12deg)}to{transform:translate3d(var(--dx),var(--dy),0) rotate(17deg)}}
@keyframes edgeCoinTilt{from{transform:perspective(400px) rotateY(-32deg) rotateZ(-8deg)}to{transform:perspective(400px) rotateY(35deg) rotateZ(10deg)}}
@media(prefers-reduced-motion:reduce){.edge-coin{transform:none;transition:none}.edge-coin-float,.edge-coin img{animation:none!important}}
/* Spherical sports balls rotate without the coin-like perspective tilt. */
.t-sport .edge-coin img{animation:sportsBallTurn 9s var(--delay) ease-in-out infinite alternate}
@keyframes sportsBallTurn{from{transform:rotate(-18deg)}to{transform:rotate(24deg)}}
@media(prefers-reduced-motion:reduce){.t-sport .edge-coin img{animation:none!important}}

function fit(){var bx=document.querySelectorAll('.msgs');for(var i=0;i<bx.length;i++){var b=bx[i],mis=b.querySelectorAll('.mi');
for(var j=0;j<mis.length;j++){var m=mis[j];m.style.transform='none';var s=Math.min(1,(b.clientWidth-2)/m.offsetWidth,(b.clientHeight-2)/m.offsetHeight);m.style.transform='scale('+s.toFixed(3)+')';}}}
var ms=[].slice.call(document.querySelectorAll('.m')),HOLD=2800,cur=-1;
var EIN='cubic-bezier(.16,1,.3,1)',EOUT='cubic-bezier(.7,0,.84,0)';
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(el){var f=el.getAttribute('data-f'),m=f.match(/^([0-9.]+)(.*)$/);if(!m)return;
var dot=m[1].indexOf('.')>-1,n=parseInt(m[1].replace(/\./g,''),10),suf=m[2],s0=performance.now(),d=950;
function fmt(v){var x=String(v);return dot?x.replace(/\B(?=(\d{3})+(?!\d))/g,'.'):x;}
(function st(now){var p=Math.min(1,(now-s0)/d);p=1-Math.pow(1-p,4);el.textContent=fmt(Math.round(n*p))+suf;if(p<1)requestAnimationFrame(st);else el.textContent=f;})(s0);}
function anim(el,kf,o){if(el.animate)return el.animate(kf,o);el.style.transform=kf[kf.length-1].transform;}
var hw=document.querySelector('.hwrap'),mb=document.querySelector('.msgs'),sl=hw?[].slice.call(hw.querySelectorAll('.slide')):[];
// Advance the hero ball once per complete iris close/open cycle.
var heroBall=hw?hw.querySelector('.ball img'):null,ballTurn=0;
var sportBalls=['ball.webp','basketball.webp','tennis.webp','volleyball.webp'];
for(var bi=1;bi<sportBalls.length;bi++){var preloadBall=new Image();preloadBall.src=sportBalls[bi];}
function R(el){return Math.ceil(Math.sqrt(el.offsetWidth*el.offsetWidth+el.offsetHeight*el.offsetHeight)/2)+2;}
function edge(el,open,d,ez){var r=el.getBoundingClientRect(),a=ad.getBoundingClientRect(),rr=R(el),e=document.createElement('i');
e.className='ring edge';e.style.cssText='left:'+(r.left-a.left+r.width/2)+'px;top:'+(r.top-a.top+r.height/2)+'px;width:'+(rr*2)+'px;height:'+(rr*2)+'px';ad.appendChild(e);
var s0=open?.001:1,s1=open?1:.001;
e.animate([{transform:'translate(-50%,-50%) scale('+s0+')',opacity:1},{transform:'translate(-50%,-50%) scale('+((s0+s1)/2)+')',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale('+s1+')',opacity:0}],{duration:d,easing:ez,fill:'both'}).onfinish=function(){e.parentNode&&e.parentNode.removeChild(e);};}
function iris(el,open,d){if(!el||!el.animate)return;var rr=R(el),C0='circle(0px at 50% 50%)',C1='circle('+rr+'px at 50% 50%)';
var ez=open?'cubic-bezier(.22,1,.36,1)':'cubic-bezier(.65,0,.35,1)';
var k=open?[{clipPath:C0,transform:'scale(1.3) rotate(14deg)',filter:'blur(3px) brightness(1.7)'},{clipPath:C1,transform:'none',filter:'blur(0) brightness(1)'}]
:[{clipPath:C1,transform:'none',filter:'blur(0) brightness(1)'},{clipPath:C0,transform:'scale(.75) rotate(-14deg)',filter:'blur(3px) brightness(1.7)'}];
el.animate(k,{duration:d,easing:ez,fill:'both'});edge(el,open,d,ez);}
function rings(el,big){if(!el||!el.animate)return;var r=el.getBoundingClientRect(),a=ad.getBoundingClientRect();
var cx=r.left-a.left+r.width/2,cy=r.top-a.top+r.height/2,s=Math.min(Math.max(r.width,r.height),r.height*(big?2.4:1.9));
for(var k=0;k<3;k++){(function(k){var e=document.createElement('i');e.className='ring'+(k==1?' thin':'');
e.style.cssText='left:'+cx+'px;top:'+cy+'px;width:'+s+'px;height:'+s+'px';ad.appendChild(e);
var an=e.animate([{transform:'translate(-50%,-50%) scale(.05)',opacity:0},{opacity:.95,offset:.2},{transform:'translate(-50%,-50%) scale(1.2)',opacity:0}],{duration:1000,delay:k*130,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'});
an.onfinish=function(){e.parentNode&&e.parentNode.removeChild(e);};})(k);}}
function swap(i){var loaded=false;for(var k=0;k<sl.length;k++){var active=+sl[k].getAttribute('data-i')===i;sl[k].classList.toggle('act',active);if(active&&sl[k].complete&&sl[k].naturalWidth)loaded=true;}if(hw)hw.classList.toggle('hasimg',loaded);}
function show(i,first){var m=ms[i],ins=m.querySelectorAll('.in');m.classList.add('on');
for(var k=0;k<ins.length;k++){anim(ins[k],[{transform:'translateY(110%)'},{transform:'translateY(0)'}],{duration:750,delay:k*120,easing:EIN,fill:'both'});}
var b=m.querySelector('.num');if(b)count(b);
if(hw){if(!first&&heroBall){ballTurn=(ballTurn+1)%sportBalls.length;heroBall.src=sportBalls[ballTurn];}swap(i);if(!first){iris(hw,true,950);rings(hw,true);}}}
function hide(i){var m=ms[i],ins=m.querySelectorAll('.in');for(var k=0;k<ins.length;k++){anim(ins[k],[{transform:'translateY(0)'},{transform:'translateY(-110%)'}],{duration:450,delay:k*70,easing:EOUT,fill:'both'});}if(hw)iris(hw,false,680);
setTimeout(function(){m.classList.remove('on');},720);}
function step(){var nx=(cur+1)%ms.length,first=cur<0;
if(!first)hide(cur);
setTimeout(function(){show(nx,first);cur=nx;setTimeout(step,HOLD);},first?0:740);}
fit();
if(RM){ms[0].classList.add('on');swap(0);}else{setTimeout(step,900);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
// Pointer depth is independent of the ambient coin animation.
(function(){
 var layer=ad.querySelector('.edge-coins');
 if(!layer||RM)return;
 ad.addEventListener('pointermove',function(e){
  if(ad.classList.contains('end')||e.pointerType==='touch')return;
  var r=ad.getBoundingClientRect();
  layer.style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*14+'px');
  layer.style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*12+'px');
 });
 ad.addEventListener('pointerleave',function(){
  layer.style.setProperty('--px','0px');layer.style.setProperty('--py','0px');
 });
})();
</script></body></html>
