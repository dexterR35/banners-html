/* Story planes: photographs, atmosphere and independently animated objects. */
#ad{--px:0;--py:0;background:#080f20}
.fx{opacity:.2}.sweep{opacity:.16}.hero{display:none}
.story-stage{position:absolute;z-index:3;left:0;top:0;width:300px;height:300px;overflow:hidden;pointer-events:none;isolation:isolate;mask-image:linear-gradient(#000 78%,transparent 100%);-webkit-mask-image:linear-gradient(#000 78%,transparent 100%)}
.story-scene{position:absolute;inset:0;opacity:0;transition:opacity .48s ease;overflow:hidden}
.story-scene.on{opacity:1}
.scene-camera{position:absolute;inset:-4%;transform:translate3d(calc(var(--px)*-5px),calc(var(--py)*-4px),0)}
.scene-photo{width:100%;height:100%;display:block;object-fit:cover;will-change:transform}
.story-light{position:absolute;inset:-15%;opacity:.2;mix-blend-mode:screen;transform:translate3d(calc(var(--px)*14px),calc(var(--py)*10px),0);background:radial-gradient(ellipse at 70% 12%,#ffe5a088,transparent 52%)}
.story-dust{position:absolute;inset:0;transform:translate3d(calc(var(--px)*20px),calc(var(--py)*12px),0)}
.story-dust i{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;background:#ffedc4;border-radius:50%;box-shadow:0 0 5px #ffe5a0;animation:storyDust var(--d) ease-in-out infinite alternate;opacity:.5}
.story-flash{position:absolute;inset:0;z-index:8;pointer-events:none;background:radial-gradient(ellipse at 70% 20%,#edf4ff,transparent 74%);opacity:0;mix-blend-mode:screen}
.story-bolt{position:absolute;inset:0;width:100%;height:100%;opacity:0;filter:drop-shadow(0 0 5px #87abff);stroke-dasharray:650;stroke-dashoffset:0}
.flight-ball{position:absolute;z-index:5;left:0;top:0;width:34%;aspect-ratio:1;opacity:0;transform-origin:center;filter:drop-shadow(-6px 10px 5px #0008)}
.flight-ball img{width:100%;height:100%;display:block}
.story-coins{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity .5s;transform:translate3d(calc(var(--px)*-12px),calc(var(--py)*-8px),0)}
.story-coins img{position:absolute;width:var(--size);left:var(--x);top:var(--y);filter:drop-shadow(0 5px 4px #0007);animation:storyCoin var(--d) ease-in-out infinite alternate;animation-delay:var(--delay)}
.story-slot{position:absolute;left:9%;top:32%;width:82%;height:36%;opacity:0;transition:opacity .3s;z-index:5;filter:drop-shadow(0 5px 15px #f7cb8d66)}
.story-slot>img{width:100%;height:100%;object-fit:cover;border-radius:10%}

.big{background:none;background-clip:border-box;-webkit-background-clip:border-box;color:#fffaf2;-webkit-text-fill-color:#fffaf2;filter:none;text-shadow:0 2px 5px rgba(0,0,0,.28);animation:none}

#ad.t-sport{--bg:radial-gradient(90% 115% at 65% 20%,#07391f 0%,#032415 44%,#00130c 82%,#000b07 100%);--acc:#36d98a;--glow:rgba(35,191,115,.28);--ctaBg:linear-gradient(180deg,#25c879 0%,#119a59 58%,#087642 100%);--ctaTxt:#fff;--ctaSh:#034b2a;--pulse:rgba(36,201,120,.3);background:var(--bg)}

.t-sport .story-progress b{background:#53d59a}

reduced.addEventListener('change',motionChanged);
window.storyController={pause:pause,play:play,seek:seek,restart:restart,state:function(){return{scene:scene,time:ms,paused:paused,done:false,reduced:reduced.matches,cycle:cycle}}};
